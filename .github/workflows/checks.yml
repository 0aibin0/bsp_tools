name: checks

# 离线自查（11 项）：自测 / 主题 / 时序 / 多设备 / initcode / 布局 /
# 换行 / 面板宽度 / 说明框 / 控件尺寸 / 启动冒烟。
# 真机相关的 4 项（verify_commands 等）需要连板子，CI 里跑不了。

on:
  push:
    # 仓库默认分支是 master。原来的 main 是历史分支（内容全部包含在
    # master 里），已于 v3.2.27 之后删除，这里只跑 master。
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    # 必须是 windows：界面/布局检查跑 Qt，smoke_start 还要真实桌面会话。
    # Linux runner 上没有 DPI/Qt 平台插件，这 11 项跑不全。
    runs-on: windows-latest
    env:
      # 中文输出：Windows runner 上不设这个，打印中文会 UnicodeEncodeError。
      # run_checks.py 自己也做了 reconfigure 兜底，这里是双保险。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install --upgrade pip -r requirements.txt

      # 界面检查依赖真实字体度量：QSpinBox 定宽 58px 是按「Microsoft YaHei UI」
      # 算出来的。runner 上没装中文字体时 Qt 会回退到更宽的字体，一批定宽控件
      # 就会被判「文字裁切」——这不是代码问题，是环境缺字体。
      # Windows runner 自带微软雅黑（msyh.ttc），把 Qt 的字体目录指过去即可。
      - name: 配置 Qt 字体目录
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Windows\Fonts",
            "$env:WINDIR\Fonts"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "msyh.ttc") } | Select-Object -First 1
          if (-not $found) { $found = "C:\Windows\Fonts" }
          Write-Host "QT_QPA_FONTDIR=$found"
          "QT_QPA_FONTDIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # run_checks.py 会优先用 .venv；CI 里没有，会自动退回 sys.executable
      #
      # 失败时把 FAIL 行写成 ::error:: 注解：GitHub 会把它显示在 Actions 页面，
      # 也能通过公开的 check-runs/annotations API 读到——否则只能翻完整日志。
      - name: 离线自查
        shell: pwsh
        run: |
          python run_checks.py *> checks.log
          $code = $LASTEXITCODE
          $lines = Get-Content checks.log
          $lines | Select-Object -Last 30

          # 结果摘要写成 notice 注解：Actions 页面可见，也方便用公开 API 核对
          # （没有这句就只能翻日志，而日志下载需要 admin 权限）
          $summary = ($lines | Select-Object -Last 8) -join ' | '
          Write-Host "::notice title=自查结果::exit=$code $summary"

          if ($code -ne 0) {
            $fails = @($lines | Select-String -Pattern 'FAIL|项失败|超时' |
                       ForEach-Object { $_.Line.Trim() })
            if ($fails.Count -eq 0) { $fails = @($lines | Select-Object -Last 20) }
            foreach ($line in $fails) { Write-Host "::error::$line" }
            exit $code
          }
