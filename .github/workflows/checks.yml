name: checks

# 离线自查（11 项）：自测 / 主题 / 时序 / 多设备 / initcode / 布局 /
# 换行 / 面板宽度 / 说明框 / 控件尺寸 / 启动冒烟。
# 真机相关的 4 项（verify_commands 等）需要连板子，CI 里跑不了。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    # 必须是 windows：界面/布局检查跑 Qt，smoke_start 还要真实桌面会话。
    # Linux runner 上没有 DPI/Qt 平台插件，这 11 项跑不全。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install --upgrade pip -r requirements.txt

      # run_checks.py 会优先用 .venv；CI 里没有，会自动退回 sys.executable
      - name: 离线自查
        run: python run_checks.py
